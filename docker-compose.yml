# MetaCSV — local compose stack.
#
#   docker compose up -d
#
# Services:
#   db       PostgreSQL 18 (auth, schema, jobs)
#   web      Next.js app (dev or standalone build)
#   pgadmin  Optional: browse the database (commented out)

services:
  db:
    image: postgres:16-alpine
    container_name: genmetaai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: genmetaai
      POSTGRES_USER: mrdisable
      POSTGRES_PASSWORD: mrdisable
    ports:
      - '5440:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mrdisable -d genmetaai']
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: genmetaai-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      DATABASE_URL: 'postgresql://mrdisable:mrdisable@db:5440/genmetaai'
      NEXTAUTH_URL: 'http://localhost:3000'
      NEXT_PUBLIC_APP_URL: 'http://localhost:3000'

volumes:
  db-data:
